name: review-gates

# This workflow deliberately runs from the default branch. It does not check
# out, execute, or grant write authority to code from the PR under review.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [workflow]
    types: [completed]
  workflow_dispatch:
    inputs:
      bootstrap_pr:
        description: Merged bootstrap PR to verify (diagnostic only)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write

# Serialize publishers; do not cancel a run after it has invalidated a status.
concurrency:
  group: trusted-host-review-gate
  cancel-in-progress: false

jobs:
  host-review-gate:
    name: Publish host review status
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The default-branch version supplies both the workflow and the
          # gate code. A PR cannot relax this run by editing its own files.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare trusted validator dependencies
        run: node scripts/install-native-lock.mjs
      - name: Revalidate current host reviews
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BOOTSTRAP_PR: ${{ inputs.bootstrap_pr }}
          # Repository variables are owner-managed role mappings, never data
          # accepted from a PR event or checkout.
          REQUIRED_ROLES: ${{ vars.GOVERNANCE_REQUIRED_REVIEW_ROLES }}
          REVIEW_IDENTITIES: ${{ vars.GOVERNANCE_REVIEW_IDENTITIES }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            mode=(--verify-merged --pr "$BOOTSTRAP_PR")
          else
            mode=(--publish)
          fi
          node scripts/check-host-reviews.mjs \
            --repository "$REPOSITORY" \
            --stage final \
            --required-roles "$REQUIRED_ROLES" \
            --identities "$REVIEW_IDENTITIES" \
            "${mode[@]}"
